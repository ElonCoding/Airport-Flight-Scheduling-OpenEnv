[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airport-scheduling-env"
version = "0.1.0"
description = "Airport Flight Scheduling OpenEnv Environment"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
server = "server.app:start"

[tool.hatch.build.targets.wheel]
packages = ["server", "tasks", "graders"]
